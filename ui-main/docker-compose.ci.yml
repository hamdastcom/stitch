name: ${UNIQUE_NAME:?UNIQUE_NAME is required}

services:
  ui:
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${UNIQUE_NAME}
    restart: unless-stopped
    init: true

    networks:
      - traefik

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # HTTPS router
      - "traefik.http.routers.${UNIQUE_NAME}.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)"
      - "traefik.http.routers.${UNIQUE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${UNIQUE_NAME}.tls=true"
      - "traefik.http.routers.${UNIQUE_NAME}.tls.certresolver=production"
      - "traefik.http.routers.${UNIQUE_NAME}.service=${UNIQUE_NAME}"

      # UI service
      - "traefik.http.services.${UNIQUE_NAME}.loadbalancer.server.port=${APP_PORT:-80}"

networks:
  traefik:
    external: true
    name: traefik
